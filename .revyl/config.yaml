# Minimal native SwiftUI fixture for Revyl proof-of-changes dogfood.
# Wired to the local/staging stack via revyl-dev GitHub App.
# Project scheme names stay SwiftMinimal (matches xcodeproj); repo brand is swift-proof-fixture.

project:
    name: swift-proof-fixture

build:
    system: Xcode
    platforms:
        ios:
            command: xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
            output: build/Build/Products/Debug-iphonesimulator/*.app
            scheme: SwiftMinimal
            app_id: fa9056dd-c82e-40ad-8aff-c3055dd8e0be

defaults:
    open_browser: true
    timeout: 600

pr_review:
    enabled: true
    skip_drafts: true
    actions:
        preview_link: true
        proof_of_changes: true
        # model_id is a retired Cursor model on purpose: it exercises the
        # fallback that launches on Auto instead of failing the pull request.
        proof_harness:
            kind: cursor
            model_id: claude-3-opus
        # Empty on purpose: the agent verifies what the pull request changed.
        checks: []
    builds:
        ios:
            enabled: true
            framework: native_ios
            app: fa9056dd-c82e-40ad-8aff-c3055dd8e0be
            root_dir: ./
            # One line: remote runners execute each build_command line separately.
            build_command: xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
            artifact_path: build/Build/Products/Debug-iphonesimulator/*.app
