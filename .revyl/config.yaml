project:
    id: 661a6e16-d93a-5d57-a289-419091c391dc
session:
    idle_timeout_seconds: 600
build:
    framework: expo
    profiles:
        development:
            ios:
                app_id: 552ac453-ea6b-458e-bbc1-1083555a2ffd
                build_commands:
                    - xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
                output_path: build/Build/Products/Debug-iphonesimulator/*.app
            android:
                app_id: 5ab9aae8-d64c-4bde-8bdc-c9779d498d5d
                build_commands:
                    - ./gradlew assembleDebug
                output_path: app/build/outputs/apk/debug/app-debug.apk
        pr-review:
            ios:
                app_id: 552ac453-ea6b-458e-bbc1-1083555a2ffd
                build_commands:
                    - xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
                output_path: build/Build/Products/Debug-iphonesimulator/*.app
            android:
                app_id: 5ab9aae8-d64c-4bde-8bdc-c9779d498d5d
                build_commands:
                    - ./gradlew assembleDebug
                output_path: app/build/outputs/apk/debug/app-debug.apk
pr_review:
    enabled: true
    review_triggers:
        drafts: false
    build:
        kind: revyl
        profile: pr-review
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
    strict_ci_check:
        build: true
