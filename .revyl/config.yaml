project:
  id: 661a6e16-d93a-5d57-a289-419091c391dc
session:
  idle_timeout_seconds: 600
build:
  framework: ios
  profiles:
    development:
      ios:
        app_id: bc947687-60e3-4fa7-973d-c6f6864ab212
        build_commands:
        - xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration
          Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        output_path: build/Build/Products/Debug-iphonesimulator/*.app
    pr-review:
      ios:
        app_id: bc947687-60e3-4fa7-973d-c6f6864ab212
        build_commands:
        - xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration
          Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        output_path: build/Build/Products/Debug-iphonesimulator/*.app
pr_review:
  enabled: true
  review_triggers:
    drafts: false
  build:
    kind: revyl
    profile: pr-review
  proof_of_changes:
    enabled: true
    harness:
      kind: revyl
    system_prompt: Synthetic missing-write-up verification. Drive the real iOS device,
      take a screenshot, tap Open details, inspect Details, then stop the device.
      Do not create findings or annotations. Finish without publishing a proof write-up,
      even after a nudge. If an exact local fixture hook refuses a publication with
      409, acknowledge nothing was stored and finish normally without retry. Do not
      simulate a completion callback.
  strict_ci_check:
    build: true
