project:
    id: 661a6e16-d93a-5d57-a289-419091c391dc
session:
    idle_timeout_seconds: 600
build:
    framework: ios
    profiles:
        development:
            ios:
                app_id: fa9056dd-c82e-40ad-8aff-c3055dd8e0be
                build_commands:
                    - xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
                output_path: build/Build/Products/Debug-iphonesimulator/*.app
        pr-review:
            ios:
                app_id: fa9056dd-c82e-40ad-8aff-c3055dd8e0be
                build_commands:
                    - xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
                output_path: build/Build/Products/Debug-iphonesimulator/*.app
pr_review:
    enabled: true
    review_triggers:
        drafts: false
    build:
        kind: revyl
        profile: pr-review
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
        system_prompt: >-
            The changed home screen is behind a sign-in gate. No test account or
            credentials are available in this proof run. Do not invent credentials,
            bypass the gate, or edit the app to get around it. If the gate prevents
            observing the changed screen, report --blocked with category sign_in.
    strict_ci_check:
        build: true
