project:
    id: 661a6e16-d93a-5d57-a289-419091c391dc
session:
    idle_timeout_seconds: 600
build:
    framework: ios
    profiles:
        development:
            ios:
                app_id: fa9056dd-c82e-40ad-8aff-c3055dd8e0be
                build_commands:
                    - xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
                output_path: build/Build/Products/Debug-iphonesimulator/*.app
        pr-review:
            ios:
                app_id: fa9056dd-c82e-40ad-8aff-c3055dd8e0be
                build_commands:
                    - xcodebuild -project SwiftMinimal.xcodeproj -scheme SwiftMinimal -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
                output_path: build/Build/Products/Debug-iphonesimulator/*.app
pr_review:
    enabled: true
    review_triggers:
        drafts: false
    build:
        kind: revyl
        profile: pr-review
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
        system_prompt: >-
            This fixture intentionally presents a sign-in gate with no test account.
            Do not invent credentials or bypass the gate. When it prevents observing
            the changed home, publish with this exact separate CLI flag: revyl proof
            comment write-up.md --blocked "The changed home could not be observed
            because no test account is available" --blocked-reason-category sign_in.
            The category must be passed as --blocked-reason-category sign_in, not
            merely written inside the blocked sentence.
    strict_ci_check:
        build: true
