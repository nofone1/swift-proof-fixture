project:
    id: 661a6e16-d93a-5d57-a289-419091c391dc
session:
    idle_timeout_seconds: 600
    auth_bypass:
        launch_vars:
            - REVYL_AUTH_BYPASS_ENABLED
            - REVYL_AUTH_BYPASS_TOKEN
        deep_link: bug-bazaar://revyl-auth?token=${REVYL_AUTH_BYPASS_TOKEN}&role=collector&redirect=%2Faccount
build:
    framework: ios
pr_review:
    enabled: true
    review_triggers:
        drafts: true
    build:
        kind: ci_upload_to_revyl
        app_ids:
            ios: 92cb43cd-3432-4a30-b3b3-b6275fadee12
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
    strict_ci_check:
        build: true
